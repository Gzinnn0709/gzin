# Copie para gabecuts.toml e ajuste. Toda opção também pode ser passada por variável de
# ambiente: GABECUTS_<NOME_EM_MAIUSCULAS>, ex: GABECUTS_THRESHOLD=5
channel = "gabepeixe"
platform = "kick"                # de onde vem o VÍDEO: "kick" (Gabepeixe) ou "twitch"
# chat_sources = "twitch,kick"   # multistream: soma os chats das duas plataformas
# twitch_channel = ""            # se o nome do canal mudar de uma plataforma para outra
# kick_channel = ""
# kick_chatroom_id = 0           # se a API da Kick (Cloudflare) bloquear; veja o README
stream_quality = "auto"          # auto = até record_max_height; ou "best", "720p60", "480p"...
record_max_height = 720          # 720p = metade da internet/CPU de 1080p (não trava a live no navegador)
low_priority = true              # o navegador vem primeiro
encode_threads = 2
data_dir = "data"

# Sensibilidade: maior = menos cortes, só os momentos mais fortes
threshold = 3.0
target_clips_per_hour = 12       # se ficar muito tempo sem corte, fica mais sensível sozinho (0 = desliga)
threshold_floor = 1.8
chat_delay = 4.0                 # segundos entre o acontecimento e a reação do chat
pre_roll = 12.0                  # contexto antes do momento (TikTok: gancho rápido)
post_roll = 8.0
min_clip_seconds = 15
max_clip_seconds = 45           # TikTok: 15–45 s retêm melhor

# Pesos dos sinais
w_chat = 1.0
w_laugh = 1.5
w_hype = 1.0
w_clip_call = 1.5
w_audio = 0.7

# Saída
vertical = true                  # gera 9:16 para TikTok/Shorts/Reels
burn_subtitles = true            # legenda palavra por palavra, estilo TikTok (precisa do faster-whisper)
cut_silences = false             # tira silêncios parados (em jogo parece "travada"; ligue só se quiser)
zoom_on_reaction = true          # zoom rápido na hora da reação
hook_text = false                # texto de gancho em cima do vídeo (true para ligar)
# music_dir = "musicas"          # pasta com músicas de fundo (subpastas por categoria: musicas/engraçado ...)
                                 # use só músicas que você tem direito de usar; o melhor é pôr o som
                                 # em alta pelo próprio TikTok na hora de postar
whisper_model = "auto"           # auto (base na CPU, small com GPU), tiny/base/small/medium, ou "off"

# IA (precisa de ANTHROPIC_API_KEY no ambiente)
ai_enabled = true
ai_model = "claude-opus-5-5"
ai_min_score = 50

# Avisos no Discord quando sair corte novo
discord_webhook_url = ""
public_base_url = ""
web_port = 8000
